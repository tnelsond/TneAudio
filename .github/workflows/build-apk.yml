name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk USB-Recorder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Recorder-apk
          path: USB-Recorder.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest USB-Recorder.apk --title "USB Recorder (latest build)" --notes "Built from ${GITHUB_SHA::7}. Download USB-Recorder.apk on your phone and install it."
